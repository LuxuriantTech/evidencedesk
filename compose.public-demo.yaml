name: evidencedesk-public-demo

# Synthetic-only, single-replica demo overlay intended to sit behind a TLS edge.
# Host ports remain on loopback; exposing that edge is a separate, explicit action.
x-public-demo-environment: &public-demo-environment
  ENVIRONMENT: public-demo
  PUBLIC_DEMO_MODE: "true"
  DEMO_ADMIN_ENABLED: "false"
  DEMO_READER_ENABLED: "false"
  JWT_SECRET: ${PUBLIC_DEMO_JWT_SECRET:?Set PUBLIC_DEMO_JWT_SECRET to at least 32 random characters}
  DEMO_ANALYST_PASSWORD: ${PUBLIC_DEMO_ANALYST_PASSWORD:?Set PUBLIC_DEMO_ANALYST_PASSWORD}
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  AUTH_REQUESTS_PER_WINDOW: "5"
  ASK_REQUESTS_PER_WINDOW: "30"
  UPLOAD_REQUESTS_PER_WINDOW: "5"

services:
  migrate:
    environment: *public-demo-environment

  seed:
    environment: *public-demo-environment

  api:
    environment: *public-demo-environment

  worker:
    environment: *public-demo-environment

  web:
    build:
      args:
        NGINX_CONFIG: infra/nginx/public-demo.conf

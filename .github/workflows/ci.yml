name: EvidenceDesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: evidencedesk
          POSTGRES_USER: evidencedesk
          POSTGRES_PASSWORD: evidencedesk-local-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U evidencedesk -d evidencedesk"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://evidencedesk:evidencedesk-local-only@127.0.0.1:55432/evidencedesk
      REDIS_URL: redis://127.0.0.1:56379/0
      STORAGE_ROOT: /tmp/evidencedesk-storage
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
      DEMO_ADMIN_PASSWORD: EvidenceDemo-Admin-2026!
      DEMO_ANALYST_PASSWORD: EvidenceDemo-Analyst-2026!
      DEMO_READER_PASSWORD: EvidenceDemo-Reader-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.7"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run alembic upgrade head
      - run: uv run ruff check apps/api apps/worker evals scripts
      - run: uv run mypy
      - run: uv run python scripts/check_supply_chain_refs.py
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run pip-audit --strict

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm audit --omit=dev --audit-level=high

  stack-e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - run: docker compose up --build --wait --wait-timeout 180
      - working-directory: apps/web
        env:
          E2E_REAL_API: "1"
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_DEMO_ADMIN_PASSWORD: EvidenceDemo-Admin-2026!
        run: npm run e2e -- --grep "real stack"
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down --volumes --remove-orphans

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
